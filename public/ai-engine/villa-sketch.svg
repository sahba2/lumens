<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="کروکی خطی ویلای کنسولی؛ مرحله پیش از رندر در موتور ایده‌پرداز لومنز">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#16171d" />
      <stop offset="55%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <radialGradient id="paperGlow" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.78" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)" />
  <rect width="1200" height="800" fill="url(#paperGlow)" />

  <!-- construction grid -->
  <g stroke="#9aa0aa" stroke-width="1" opacity="0.07">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200" />
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800" />
  </g>

  <!-- horizon + mountain trace -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 562C118 538 162 498 210 510s56 34 98 20 66-52 118-44 58 44 100 46 76-38 124-28 74 22 130 14" stroke="#a6adb8" stroke-width="1" opacity="0.28" stroke-dasharray="6 8" />
    <path d="M60 652H1140" stroke="#f3eee2" stroke-width="1.5" opacity="0.5" />
    <path d="M60 658H1140" stroke="#f3eee2" stroke-width="0.7" opacity="0.2" />
  </g>

  <!-- ground hatching -->
  <g stroke="#d8dbe0" stroke-width="0.8" opacity="0.13">
    <path d="M70 668l-16 18M110 668l-16 18M150 668l-16 18M190 668l-16 18M230 668l-16 18M270 668l-16 18M310 668l-16 18M350 668l-16 18M390 668l-16 18M430 668l-16 18M470 668l-16 18M510 668l-16 18M550 668l-16 18M590 668l-16 18" />
    <path d="M1040 668l-16 18M1080 668l-16 18M1120 668l-16 18" />
  </g>

  <!-- ============ building line work ============ -->
  <g filter="url(#rough)" fill="none" stroke="#f5f1e6" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof blade -->
    <path d="M286 290H1010M286 302H1010M286 290V302M1010 290V302" stroke-width="2.2" opacity="0.92" />
    <path d="M286 290L330 274H964L1010 290" stroke-width="1" opacity="0.35" />
    <!-- upper volume -->
    <path d="M320 302V474H900" stroke-width="2.1" opacity="0.9" />
    <path d="M600 302V474" stroke-width="1.2" opacity="0.6" />
    <path d="M320 400H600" stroke-width="1" opacity="0.4" />
    <!-- upper glazing -->
    <path d="M610 312H890V466H610Z" stroke-width="1.1" opacity="0.55" />
    <path d="M660 312V466M720 312V466M780 312V466M840 312V466" stroke-width="0.8" opacity="0.4" />
    <!-- lower volume -->
    <path d="M340 474V652H900" stroke-width="2" opacity="0.9" />
    <path d="M340 474H470M470 474V652" stroke-width="1.6" opacity="0.7" />
    <!-- lower glazing -->
    <path d="M470 486H888V646H470Z" stroke-width="1.1" opacity="0.55" />
    <path d="M530 486V646M590 486V646M650 486V646M710 486V646M770 486V646M830 486V646" stroke-width="0.8" opacity="0.38" />
    <!-- interior furniture hints -->
    <path d="M560 646v-26h58v26M700 646v-20h74v20M790 646v-34" stroke-width="0.9" opacity="0.35" />
    <!-- support column -->
    <path d="M978 302V652M992 302V652" stroke-width="1.6" opacity="0.75" />
    <path d="M970 652H1000" stroke-width="1.4" opacity="0.6" />
    <!-- cantilever soffit shadow -->
    <path d="M900 474H978" stroke-width="1" stroke-dasharray="5 5" opacity="0.45" />
    <!-- terrace + pool -->
    <path d="M200 652H1030" stroke-width="1.2" opacity="0.5" />
    <path d="M600 672H1150L1110 780H640Z" stroke-width="1.6" opacity="0.65" />
    <path d="M600 678H1144M640 690H1138M648 706H1130M656 722H1122M664 738H1114M672 754H1106" stroke-width="0.7" opacity="0.28" />
  </g>

  <!-- scale figures -->
  <g filter="url(#rough)" fill="none" stroke="#f5f1e6" stroke-linecap="round" stroke-width="1.3" opacity="0.55">
    <path d="M540 652v-30M540 626l-7 8M540 626l7 8M533 622a7 7 0 1 1 14 0 7 7 0 0 1-14 0M540 634l-9 12M540 634l9 12" />
    <path d="M576 652v-26M569 622a6 6 0 1 1 12 0 6 6 0 0 1-12 0M576 632l-8 10M576 632l7 10" />
  </g>

  <!-- trees -->
  <g filter="url(#rough)" fill="none" stroke="#cfd6cb" stroke-linecap="round" opacity="0.42">
    <path d="M150 560a78 78 0 0 1 96 8 62 62 0 0 1 28 66c-8 28-44 44-80 40s-66-24-64-58a62 62 0 0 1 20-56Z" stroke-width="1.3" />
    <path d="M120 600c18 10 30 30 34 52M186 566c6 14 6 24 2 34M236 574c10 14 14 30 10 44M158 484v176M150 508c-14 6-22 18-26 30M166 528c14 4 24 14 28 26" stroke-width="1" />
    <path d="M246 604a40 40 0 0 1 50 4 32 32 0 0 1 12 34c-6 16-24 24-42 22s-32-14-30-30a32 32 0 0 1 10-30Z" stroke-width="1.1" />
    <path d="M270 512v140M262 536c-8 4-12 10-14 18M278 552c8 2 14 8 16 14" stroke-width="1" />
    <path d="M1156 604c-14 6-24 20-24 36 0 12 8 20 20 22" stroke-width="1.1" />
    <path d="M1146 540v124M1136 566c-8 6-12 14-12 24M1158 584c8 4 12 12 12 20" stroke-width="1" />
  </g>

  <!-- dimensions -->
  <g filter="url(#rough)" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7">
    <path d="M320 238H900M320 232v12M900 232v12" />
    <path d="M320 238l10-4v8ZM900 238l-10-4v8Z" fill="#d4af37" />
    <path d="M940 302v350M934 302h12M934 652h12" />
    <path d="M940 302v-40M940 302v-26" stroke-dasharray="4 4" opacity="0.5" />
    <path d="M600 752H1150M600 746v12M1150 746v12" opacity="0.55" />
  </g>
  <g font-family="Verdana, sans-serif" font-size="10" letter-spacing="2" fill="#d4af37" opacity="0.85">
    <text x="610" y="228">18.40 m</text>
    <text x="958" y="482">6.20 m</text>
    <text x="856" y="744">POOL / 14.00 m</text>
  </g>

  <!-- annotations -->
  <g font-family="Verdana, sans-serif" font-size="9" letter-spacing="2.4" fill="#cfd3d8" opacity="0.5">
    <text x="906" y="318">CANTILEVER 3.2 m</text>
    <path d="M902 314H940" stroke="#cfd3d8" stroke-width="0.8" opacity="0.4" />
    <text x="632" y="356">GLASS 12 MM · BRONZE MULLION</text>
    <path d="M676 362V386" stroke="#cfd3d8" stroke-width="0.8" opacity="0.35" />
    <text x="356" y="522">BOARD-FORMED CONCRETE</text>
    <path d="M404 528v104" stroke="#cfd3d8" stroke-width="0.8" opacity="0.35" />
    <text x="700" y="612">POOL REFLECTION / 4.00 m</text>
    <path d="M760 618V668" stroke="#cfd3d8" stroke-width="0.8" opacity="0.3" />
  </g>

  <!-- sheet header -->
  <g font-family="Verdana, sans-serif" letter-spacing="4">
    <text x="60" y="86" font-size="12" fill="#d4af37" opacity="0.9">LUMENS / ARCHITECTURE ENGINE</text>
    <text x="60" y="110" font-size="9" fill="#cfd3d8" opacity="0.45">PHASE 01 — MASSING &amp; STRUCTURE · NOT TO SCALE</text>
    <text x="1140" y="86" font-size="9" fill="#cfd3d8" opacity="0.4" text-anchor="end">SHEET A-101</text>
    <text x="1140" y="106" font-size="9" fill="#d4af37" opacity="0.7" text-anchor="end">BEFORE · RAW SKETCH</text>
    <path d="M60 122H1140" stroke="#d4af37" stroke-width="1" opacity="0.35" />
  </g>

  <!-- scale bar -->
  <g stroke="#cfd3d8" fill="none" opacity="0.5" stroke-width="1">
    <path d="M60 772H260M60 766v12M110 766v12M160 766v12M210 766v12M260 766v12" />
    <path d="M60 766H110M160 766H210" stroke-width="5" opacity="0.25" />
  </g>
  <g font-family="Verdana, sans-serif" font-size="8" letter-spacing="2" fill="#cfd3d8" opacity="0.5">
    <text x="60" y="758">0</text>
    <text x="154" y="758">5</text>
    <text x="252" y="758">10 m</text>
  </g>

  <!-- title block -->
  <g font-family="Verdana, sans-serif" font-size="9" letter-spacing="2.4" fill="#cfd3d8" opacity="0.42">
    <text x="1140" y="742" text-anchor="end">VILLA / CANTILEVER TYPOLOGY</text>
    <text x="1140" y="762" text-anchor="end">DRAWN FROM ARABIC BRIEF · LUMENS AI</text>
  </g>

  <rect width="1200" height="800" fill="url(#vig)" />
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.055" />
  <g opacity="0.55">
    <rect x="48" y="48" width="34" height="2" fill="#d4af37" opacity="0.7" />
    <text x="94" y="55" font-family="Verdana, sans-serif" font-size="17" letter-spacing="6" fill="#d4af37" opacity="0.85">LUMENS</text>
  </g>
</svg>
