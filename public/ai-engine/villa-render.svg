  <g fill="none" stroke="#e6b183" stroke-width="1.1" opacity="0.4">
    <path d="M533 619l-2 16M540 607l3 3M566 624l-1 14" />
  </g>

  <!-- foreground shadow grade -->
  <rect x="0" y="700" width="1200" height="100" fill="#040506" opacity="0.55" />
  <rect width="1200" height="800" fill="url(#vig)" />
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.055" />

  <g opacity="0.55">
    <rect x="48" y="48" width="34" height="2" fill="#d4af37" opacity="0.7" />
    <text x="94" y="55" font-family="Verdana, sans-serif" font-size="17" letter-spacing="6" fill="#d4af37" opacity="0.9">LUMENS</text>
    <text x="1152" y="58" font-family="Verdana, sans-serif" font-size="9" letter-spacing="3" fill="#e8d8bd" opacity="0.6" text-anchor="end">AFTER · CINEMATIC RENDER</text>
