  <g stroke="#0a0c10" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M742 176l14-7 12 8M790 162l12-6 10 7M702 208l10-5 9 6" />
  </g>

  <!-- distant ranges -->
  <path d="M0 604L110 552L206 584L318 498L420 566L520 522L604 574L720 508L828 566L940 516L1046 574L1140 530L1200 566V668H0Z" fill="url(#rangeFar)" opacity="0.85" />
  <path d="M0 604L110 552L206 584L318 498L420 566L520 522L604 574L720 508L828 566L940 516L1046 574L1140 530L1200 566" fill="none" stroke="#d99a63" stroke-width="1.4" opacity="0.28" />
  <path d="M0 646L120 606L250 636L386 592L520 640L648 604L780 644L920 606L1050 646L1200 612V700H0Z" fill="url(#rangeNear)" opacity="0.9" />

