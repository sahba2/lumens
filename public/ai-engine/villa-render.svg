  <path d="M900 304L936 290V462L900 474Z" fill="url(#concShadow)" />
  <path d="M900 304L936 290" stroke="#e6b887" stroke-width="1.6" opacity="0.4" fill="none" />
  <rect x="978" y="304" width="16" height="352" fill="url(#concShadow)" />
  <rect x="978" y="304" width="3" height="352" fill="#c9a173" opacity="0.35" />

