  <g stroke="#0b0a09" stroke-width="1.2" opacity="0.35">
    <path d="M200 654V670M260 654V671M320 654V671M380 654V671M440 654V671M500 654V672M560 654V672M620 654V672M680 654V672M740 654V672M800 654V672M860 654V672M920 654V673M980 654V673M1020 654V673" />
  </g>

