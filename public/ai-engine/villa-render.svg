    <ellipse cx="560" cy="292" rx="240" ry="10" />
    <ellipse cx="880" cy="206" rx="210" ry="11" />
    <ellipse cx="1080" cy="330" rx="180" ry="9" />
    <ellipse cx="700" cy="366" rx="300" ry="8" />
