    <rect x="478" y="484" width="414" height="70" fill="#0c1417" opacity="0.55" />
    <rect x="520" y="576" width="118" height="46" fill="#2a2118" opacity="0.7" />
    <path d="M520 622h118" stroke="#c99a63" stroke-width="2" opacity="0.5" />
    <rect x="690" y="590" width="92" height="34" fill="#332619" opacity="0.75" />
    <circle cx="754" cy="540" r="9" fill="#ffcf95" opacity="0.9" filter="url(#blur4)" />
    <path d="M754 508v24" stroke="#6b5235" stroke-width="2" opacity="0.6" />
    <rect x="830" y="512" width="44" height="112" fill="#0d1518" opacity="0.5" />
    <circle cx="620" cy="534" r="7" fill="#ffd9a2" opacity="0.8" filter="url(#blur4)" />
    <path d="M620 500v27" stroke="#6b5235" stroke-width="2" opacity="0.55" />
  </g>

  <g stroke="#c9a173" stroke-width="2.6" opacity="0.55">
    <path d="M478 484H892M478 646H892M478 484V646M892 484V646M530 484V646M590 484V646M650 484V646M710 484V646M770 484V646M830 484V646" />
  </g>
  <g fill="#bcd6dd" opacity="0.07">
    <path d="M486 484H516L452 646H422Z" />
    <path d="M600 484H610L546 646H536Z" />
    <path d="M724 484H732L668 646H660Z" />
    <path d="M856 484H864L800 646H792Z" />
