  <g fill="none" stroke="#e0a56a" stroke-width="1.4" opacity="0.22">
    <path d="M62 598c14-26 38-40 66-40M348 566c18-14 40-18 60-12M1128 574c12-16 28-26 48-28" />
  </g>

  <!-- human scale -->
  <g fill="#08090a">
    <circle cx="540" cy="612" r="5.5" />
    <path d="M533 619h14l3 20-4 13h-4l-1-10-1 10h-4l-5-13Z" />
    <circle cx="572" cy="617" r="5" />
    <path d="M566 624h12l2 18-3 10h-4l-1-8-1 8h-3l-4-10Z" />
