    <linearGradient id="waterWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a763" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8a4f28" stop-opacity="0" />
