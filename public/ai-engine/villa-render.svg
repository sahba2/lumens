    <path d="M664 316V462M724 316V462M784 316V462M844 316V462" />
  </g>
  <g fill="#bcd6dd" opacity="0.09">
    <path d="M622 312H664L600 466H558Z" />
    <path d="M700 312H714L650 466H636Z" />
    <path d="M800 312H808L748 466H740Z" />
  </g>
  <rect x="612" y="312" width="288" height="154" fill="none" stroke="#150f0b" stroke-width="5" opacity="0.5" />

