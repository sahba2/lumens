  <rect x="470" y="474" width="430" height="178" fill="none" stroke="#0d0b09" stroke-width="6" opacity="0.45" />
  <rect x="470" y="474" width="430" height="10" fill="#0a0908" opacity="0.6" />

  <!-- warm light spill on the deck -->
  <path d="M486 652H884L940 690H430Z" fill="url(#spill)" filter="url(#blur9)" />

  <!-- atmospheric haze at the horizon -->
  <rect x="0" y="548" width="1200" height="104" fill="#e8b07a" opacity="0.1" filter="url(#blur24)" />

  <!-- framing landscape -->
  <g fill="#060908">
    <path d="M36 658c-18-10-26-32-20-52 6-24 28-40 52-38 4-32 34-56 66-52 18-24 54-32 78-14 30-14 66 2 76 32 28 2 48 24 48 50 0 24-16 44-40 50l-4 24H40Z" />
    <rect x="150" y="606" width="16" height="54" />
    <path d="M236 660c-4-24 8-46 30-56 4-22 24-38 46-36 20-16 46-10 58 8 22 4 34 24 30 44-2 18-16 32-34 36l-2 12h-96Z" />
    <rect x="292" y="612" width="10" height="48" />
    <path d="M1106 660c-2-34 8-62 30-78 6-26 30-42 54-38 24-16 54-8 66 14v102Z" />
    <rect x="1150" y="540" width="14" height="122" />
