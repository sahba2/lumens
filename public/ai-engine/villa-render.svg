    <rect x="742" y="342" width="52" height="48" fill="#ffc98c" opacity="0.3" filter="url(#blur4)" />
    <rect x="824" y="324" width="66" height="42" fill="#f7b877" opacity="0.22" filter="url(#blur4)" />
