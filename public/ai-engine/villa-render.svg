<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="رندر سینمایی ویلای کنسولی در نور طلایی؛ خروجی موتور ایده‌پرداز لومنز">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="28%" stop-color="#0e1622" />
      <stop offset="52%" stop-color="#2a2b38" />
      <stop offset="68%" stop-color="#5d4433" />
      <stop offset="80%" stop-color="#a9663a" />
      <stop offset="90%" stop-color="#df9f5c" />
      <stop offset="100%" stop-color="#f0bd80" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6b8" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#ffc37a" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#e08a45" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#c06a32" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rangeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b4a41" />
      <stop offset="55%" stop-color="#332c2c" />
      <stop offset="100%" stop-color="#211e21" />
    </linearGradient>
    <linearGradient id="rangeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23252a" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2722" />
      <stop offset="42%" stop-color="#171613" />
      <stop offset="100%" stop-color="#08090a" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4a4e" />
      <stop offset="35%" stop-color="#1f2c32" />
      <stop offset="100%" stop-color="#0a1013" />
